name: GCP Security Audit

on:
  schedule:
    - cron: "0 14 * * 4" # Thursdays, 14:00 UTC = 9:00 AM CT (CDT, UTC-5)
  workflow_dispatch: {}

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for Workload Identity Federation
    steps:
      - uses: actions/checkout@v4

      # Restores the finding-history file from the previous run so the email
      # can tell new findings from ones already open (with a first-seen
      # date). Key always misses (run_id is unique) so restore-keys falls
      # back to the most recent prior save; this run's updated history is
      # saved explicitly at the very end of the job (see the last step),
      # using the split restore/save actions rather than the combined
      # action's automatic post-run save - that save is gated by success(),
      # and a failed run (e.g. the audits erroring, or the email failing to
      # send) should still persist whatever history was gathered.
      # save-always: true looked like an alternative fix but is deprecated
      # and confirmed (via a live run) not to actually save the cache.
      # Can't commit this file to the repo instead - it's public, and the
      # history would leak project IDs/emails/findings.
      - uses: actions/cache/restore@v4
        with:
          path: .findings-history
          key: findings-history-${{ github.run_id }}
          restore-keys: |
            findings-history-

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: "bq" # needed for bigquery_public_audit.sh

      # This repo may be public, and Actions logs are world-readable there.
      # Register every project ID/number and org ID as a masked value so any
      # accidental print (an error message, a gcloud warning) shows as ***.
      # The audit scripts also write findings to files only - see below.
      - name: Mask org identifiers in logs
        run: |
          {
            gcloud projects list --format="value(projectId)" 2>/dev/null
            gcloud projects list --format="value(projectNumber)" 2>/dev/null
            gcloud organizations list --format="value(ID)" 2>/dev/null
          } | awk 'length($0) >= 6 { print "::add-mask::" $0 }'

      - name: Build compliance scope map
        env:
          AUDIT_SCOPE_MAP: ${{ secrets.AUDIT_SCOPE_MAP }}
        run: |
          chmod +x ./*.sh
          ./scope_map.sh .scope/scope.json

      - name: Run IAM audits
        env:
          LOOKBACK_HOURS: 168 # 7 days, matches the weekly schedule above
          # Scoping - values live in repo variables/secrets, never in code.
          EXCLUDE_NAME_REGEX: ${{ vars.EXCLUDE_NAME_REGEX }}
          EXCLUDE_ID_REGEX: ${{ vars.EXCLUDE_ID_REGEX }}
          AUDIT_ONLY_SCOPED: ${{ vars.AUDIT_ONLY_SCOPED }}
        run: |
          # -e: a genuine script error (not "found something" - the audit
          # scripts always exit 0 for that, findings are just text output)
          # should fail this step, and therefore the job. Findings alone no
          # longer fail the run - see the summary step below.
          set -euo pipefail
          chmod +x ./*.sh
          mkdir -p findings
          ./gcloud_unreskeys.sh          > findings/unrestricted_keys.txt
          ./sa_key_age_audit.sh          > findings/stale_sa_keys.txt
          ./public_access_audit.sh       > findings/public_access.txt
          ./privileged_roles_audit.sh    > findings/privileged_roles.txt
          ./audit_log_review.sh          > findings/audit_log_review.txt
          ./privilege_escalation_audit.sh > findings/privilege_escalation.txt
          ./firewall_public_audit.sh     > findings/firewall_public.txt
          ./firewall_egress_audit.sh     > findings/firewall_egress.txt
          ./firewall_policies_audit.sh   > findings/firewall_policies.txt
          ./org_wide_iam_audit.sh        > findings/org_wide_iam.txt
          ./org_policy_source_audit.sh  > findings/org_policy_source.txt
          ./logging_config_audit.sh     > findings/logging_config.txt
          ./billing_audit.sh            > findings/billing.txt
          ./external_identities_audit.sh> findings/external_identities.txt
          ./service_account_audit.sh    > findings/service_accounts.txt
          ./org_structure_audit.sh      > findings/org_structure.txt
          ./ids_ips_audit.sh            > findings/ids_ips.txt
          ./network_exposure_audit.sh   > findings/network_exposure.txt
          ./enabled_apis_audit.sh       > findings/enabled_apis.txt
          ./asset_inventory_audit.sh    > findings/asset_inventory.txt
          ./gcs_public_objects_audit.sh  > findings/gcs_public_objects.txt
          ./bigquery_public_audit.sh     > findings/bigquery_public.txt
          ./org_policy_audit.sh          > findings/org_policy_drift.txt
          ./scc_findings_audit.sh        > findings/scc_findings.txt

      # Findings are never printed to the log above. In a private repo it is
      # safe to show them there; in a public one they are only in the email.
      - name: Show findings in log (private repos only)
        if: always() && github.repository_visibility != 'public'
        run: |
          for f in findings/*.txt; do echo "=== $f"; cat "$f"; done

      # An artifact on a public repo is downloadable by any GitHub user and
      # would expose project IDs and findings, so it is skipped there.
      - name: Upload findings
        if: always() && github.repository_visibility != 'public'
        uses: actions/upload-artifact@v4
        with:
          name: gcp-security-findings-${{ github.run_number }}
          path: findings/
          retention-days: 90

      - name: Build email summary
        if: always()
        id: summary
        run: |
          # The body goes to a file, not a step output: the mail action's
          # `with:` inputs are echoed into the Actions log, which is public on
          # a public repo, so the findings must never be passed inline.
          mkdir -p .email
          REPORT=$(python3 .github/scripts/build_email_report.py)
          {
            echo "GCP Security Audit — $(date -u +%Y-%m-%d)"
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "$REPORT"
          } > .email/body.txt

      # Sends every run regardless of pass/fail, so a clean day still confirms
      # the audit actually ran - not just silence when there's nothing to flag.
      # Requires MAIL_USERNAME/MAIL_PASSWORD repo secrets (a Gmail address +
      # app password, not the account password - see README). This step is
      # NOT continue-on-error: findings alone don't fail the run anymore
      # (see below), but a failed send does - that's the point of emailing
      # findings at all, so it needs to be a real failure signal.
      - name: Email findings
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: GCP Security Audit <${{ secrets.MAIL_USERNAME }}>
          to: jchan023@gmail.com
          subject: "GCP Security Audit: ${{ steps.summary.outputs.new_count }} new, ${{ steps.summary.outputs.existing_count }} existing, ${{ steps.summary.outputs.drift_count }} drift — run #${{ github.run_number }}"
          body: file://.email/body.txt

      # Informational only - does not fail the run. Findings are expected
      # (there are permanent baseline ones, e.g. project ownership) and are
      # already reported via email above; this job's pass/fail reflects
      # whether the audits and the email actually ran, not whether anything
      # was found.
      - name: Findings summary
        if: always()
        run: |
          COUNT=$(grep -rL "^No " findings/ | wc -l | tr -d ' ')
          if [ "$COUNT" -gt 0 ]; then
            echo "::notice::$COUNT check(s) have findings - see the email (and the 'gcp-security-findings' artifact on private repos)"
          else
            echo "All clear."
          fi

      # Explicit save, not the combined action's automatic post-run save -
      # that's gated by success() and never fires given the step above. This
      # standalone step with if: always() saves unconditionally regardless
      # of job outcome. Must be the LAST step in the job.
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .findings-history
          key: findings-history-${{ github.run_id }}
