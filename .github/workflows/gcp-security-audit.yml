name: GCP Security Audit

on:
  # Schedule is disabled until GCP credentials (GCP_WORKLOAD_IDENTITY_PROVIDER /
  # GCP_SERVICE_ACCOUNT secrets) are configured - re-enable the `schedule`
  # trigger below once this is hooked up to a real GCP org.
  # schedule:
  #   - cron: "0 6 * * *" # 06:00 UTC daily
  workflow_dispatch: {}

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for Workload Identity Federation
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: "bq" # needed for bigquery_public_audit.sh

      - name: Run IAM audits
        env:
          LOOKBACK_HOURS: 24 # matches the daily schedule above
        run: |
          set -uo pipefail
          chmod +x ./*.sh
          mkdir -p findings
          ./gcloud_unreskeys.sh          | tee findings/unrestricted_keys.txt
          ./sa_key_age_audit.sh          | tee findings/stale_sa_keys.txt
          ./public_access_audit.sh       | tee findings/public_access.txt
          ./privileged_roles_audit.sh    | tee findings/privileged_roles.txt
          ./audit_log_review.sh          | tee findings/audit_log_review.txt
          ./privilege_escalation_audit.sh | tee findings/privilege_escalation.txt
          ./firewall_public_audit.sh     | tee findings/firewall_public.txt
          ./gcs_public_objects_audit.sh  | tee findings/gcs_public_objects.txt
          ./bigquery_public_audit.sh     | tee findings/bigquery_public.txt
          ./org_policy_audit.sh          | tee findings/org_policy_drift.txt
          ./scc_findings_audit.sh        | tee findings/scc_findings.txt

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gcp-security-findings-${{ github.run_number }}
          path: findings/
          retention-days: 90

      - name: Fail if any audit flagged something
        run: |
          if grep -rL "^No " findings/ | grep -q .; then
            echo "::error::One or more IAM audit checks found issues - see the uploaded 'gcp-security-findings' artifact"
            exit 1
          fi
          echo "All clear."
