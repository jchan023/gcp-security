name: GCP Security Audit

on:
  schedule:
    - cron: "0 14 * * *" # 14:00 UTC = 9:00 AM CT (CDT, UTC-5)
  workflow_dispatch: {}

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for Workload Identity Federation
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: "bq" # needed for bigquery_public_audit.sh

      - name: Run IAM audits
        env:
          LOOKBACK_HOURS: 24 # matches the daily schedule above
        run: |
          set -uo pipefail
          chmod +x ./*.sh
          mkdir -p findings
          ./gcloud_unreskeys.sh          | tee findings/unrestricted_keys.txt
          ./sa_key_age_audit.sh          | tee findings/stale_sa_keys.txt
          ./public_access_audit.sh       | tee findings/public_access.txt
          ./privileged_roles_audit.sh    | tee findings/privileged_roles.txt
          ./audit_log_review.sh          | tee findings/audit_log_review.txt
          ./privilege_escalation_audit.sh | tee findings/privilege_escalation.txt
          ./firewall_public_audit.sh     | tee findings/firewall_public.txt
          ./gcs_public_objects_audit.sh  | tee findings/gcs_public_objects.txt
          ./bigquery_public_audit.sh     | tee findings/bigquery_public.txt
          ./org_policy_audit.sh          | tee findings/org_policy_drift.txt
          ./scc_findings_audit.sh        | tee findings/scc_findings.txt

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gcp-security-findings-${{ github.run_number }}
          path: findings/
          retention-days: 90

      - name: Build email summary
        if: always()
        id: summary
        run: |
          COUNT=$(grep -rL "^No " findings/ | wc -l | tr -d ' ')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          {
            echo "body<<EMAIL_BODY_EOF"
            echo "GCP Security Audit — $COUNT check(s) with findings — $(date -u +%Y-%m-%d)"
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            for f in findings/*.txt; do
              echo "== $(basename "$f" .txt) =="
              cat "$f"
              echo
            done
            echo "EMAIL_BODY_EOF"
          } >> "$GITHUB_OUTPUT"

      # Sends every run regardless of pass/fail, so a clean day still confirms
      # the audit actually ran - not just silence when there's nothing to flag.
      # Requires MAIL_USERNAME/MAIL_PASSWORD repo secrets (a Gmail address +
      # app password, not the account password - see README).
      - name: Email findings
        if: always()
        continue-on-error: true # a missing/misconfigured mail secret shouldn't block the audit's own pass/fail signal below
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: GCP Security Audit <${{ secrets.MAIL_USERNAME }}>
          to: jchan023@gmail.com
          subject: "GCP Security Audit: ${{ steps.summary.outputs.count }} check(s) flagged — run #${{ github.run_number }}"
          body: ${{ steps.summary.outputs.body }}

      - name: Fail if any audit flagged something
        run: |
          if grep -rL "^No " findings/ | grep -q .; then
            echo "::error::One or more IAM audit checks found issues - see the uploaded 'gcp-security-findings' artifact"
            exit 1
          fi
          echo "All clear."
