name: GCP IAM Audit

on:
  schedule:
    # 06:00 UTC daily
    - cron: "0 6 * * *"
  workflow_dispatch: {}

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for Workload Identity Federation
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Run IAM audits
        run: |
          set -uo pipefail
          chmod +x ./*.sh
          mkdir -p findings
          ./gcloud_unreskeys.sh      | tee findings/unrestricted_keys.txt
          ./sa_key_age_audit.sh      | tee findings/stale_sa_keys.txt
          ./public_access_audit.sh   | tee findings/public_access.txt
          ./privileged_roles_audit.sh | tee findings/privileged_roles.txt

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gcp-iam-findings-${{ github.run_number }}
          path: findings/
          retention-days: 90

      - name: Fail if any audit flagged something
        run: |
          if grep -rL "^No " findings/ | grep -q .; then
            echo "::error::One or more IAM audit checks found issues - see the uploaded 'gcp-iam-findings' artifact"
            exit 1
          fi
          echo "All clear."
