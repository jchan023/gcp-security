name: GCP Security Audit

on:
  schedule:
    - cron: "0 14 * * *" # 14:00 UTC = 9:00 AM CT (CDT, UTC-5)
  workflow_dispatch: {}

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for Workload Identity Federation
    steps:
      - uses: actions/checkout@v4

      # Restores the finding-history file from the previous run so the email
      # can tell new findings from ones already open (with a first-seen
      # date). Key always misses (run_id is unique) so this run's updated
      # history always gets saved at the end; restore-keys falls back to the
      # most recent prior save. Can't commit this to the repo instead - it's
      # public, and the history would leak project IDs/emails/findings.
      - uses: actions/cache@v4
        with:
          path: .findings-history
          key: findings-history-${{ github.run_id }}
          restore-keys: |
            findings-history-
          # actions/cache's automatic save is gated by success() internally,
          # so it silently never saves on this workflow - it's designed to
          # fail whenever findings exist, which is nearly every run. Without
          # this, history tracking would be broken from day one.
          save-always: true

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: "bq" # needed for bigquery_public_audit.sh

      - name: Run IAM audits
        env:
          LOOKBACK_HOURS: 24 # matches the daily schedule above
        run: |
          set -uo pipefail
          chmod +x ./*.sh
          mkdir -p findings
          ./gcloud_unreskeys.sh          | tee findings/unrestricted_keys.txt
          ./sa_key_age_audit.sh          | tee findings/stale_sa_keys.txt
          ./public_access_audit.sh       | tee findings/public_access.txt
          ./privileged_roles_audit.sh    | tee findings/privileged_roles.txt
          ./audit_log_review.sh          | tee findings/audit_log_review.txt
          ./privilege_escalation_audit.sh | tee findings/privilege_escalation.txt
          ./firewall_public_audit.sh     | tee findings/firewall_public.txt
          ./gcs_public_objects_audit.sh  | tee findings/gcs_public_objects.txt
          ./bigquery_public_audit.sh     | tee findings/bigquery_public.txt
          ./org_policy_audit.sh          | tee findings/org_policy_drift.txt
          ./scc_findings_audit.sh        | tee findings/scc_findings.txt

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gcp-security-findings-${{ github.run_number }}
          path: findings/
          retention-days: 90

      - name: Build email summary
        if: always()
        id: summary
        run: |
          REPORT=$(python3 .github/scripts/build_email_report.py)
          {
            echo "body<<EMAIL_BODY_EOF"
            echo "GCP Security Audit — $(date -u +%Y-%m-%d)"
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "$REPORT"
            echo "EMAIL_BODY_EOF"
          } >> "$GITHUB_OUTPUT"

      # Sends every run regardless of pass/fail, so a clean day still confirms
      # the audit actually ran - not just silence when there's nothing to flag.
      # Requires MAIL_USERNAME/MAIL_PASSWORD repo secrets (a Gmail address +
      # app password, not the account password - see README).
      - name: Email findings
        if: always()
        continue-on-error: true # a missing/misconfigured mail secret shouldn't block the audit's own pass/fail signal below
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: GCP Security Audit <${{ secrets.MAIL_USERNAME }}>
          to: jchan023@gmail.com
          subject: "GCP Security Audit: ${{ steps.summary.outputs.new_count }} new, ${{ steps.summary.outputs.existing_count }} existing, ${{ steps.summary.outputs.drift_count }} drift — run #${{ github.run_number }}"
          body: ${{ steps.summary.outputs.body }}

      - name: Fail if any audit flagged something
        run: |
          if grep -rL "^No " findings/ | grep -q .; then
            echo "::error::One or more IAM audit checks found issues - see the uploaded 'gcp-security-findings' artifact"
            exit 1
          fi
          echo "All clear."
